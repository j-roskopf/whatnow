name: Refresh catalog data

on:
  schedule:
    # Daily at 12:00 UTC — fresh enough for leaving-soon lists; not hammering upstream APIs.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regenerate static catalog data
        env:
          STEAMGRIDDB_KEY: ${{ secrets.STEAMGRIDDB_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          OPENCRITIC_KEY: ${{ secrets.OPENCRITIC_KEY }}
        run: npm run generate-data

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data static/art
          if git diff --staged --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "Refresh catalog data [automated]"
          git push
